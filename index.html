<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HaircutGet - 剪发需求记录工具</title>
<style>
:root {
  --bg: #fafafa;
  --card-bg: #ffffff;
  --card-border: #e5e5e7;
  --text: #18181b;
  --text-secondary: #71717a;
  --text-tertiary: #a1a1aa;
  --accent: #2563eb;
  --accent-light: rgba(37,99,235,0.08);
  --danger: #ef4444;
  --danger-light: rgba(239,68,68,0.08);
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.06);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; -webkit-tap-highlight-color:transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  display: flex; justify-content: center;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  user-select: none; -webkit-user-select: none;
}
.app-container {
  width: 100%; max-width: 480px;
  min-height: 100vh; min-height: 100dvh;
  position: relative; overflow: hidden;
}

.view { display:none; flex-direction:column; min-height:100vh; min-height:100dvh; }
.view.active { display:flex; }

/* ===== CATALOG ===== */
.catalog-header {
  position: sticky; top:0; z-index:100;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  background: rgba(250,250,250,0.85);
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  border-bottom: 1px solid var(--card-border);
}
.header-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.header-logo {
  font-size: 22px; font-weight:800; letter-spacing:-0.5px; flex-shrink:0;
  color: var(--text);
}
.header-logo span { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 50%, #db2777 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header-spacer { flex:1; }
.btn-icon {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--card-border);
  background: var(--card-bg);
  display:flex; align-items:center; justify-content:center;
  font-size: 18px; cursor:pointer; color: var(--text-secondary);
  transition: all 0.15s; flex-shrink:0;
}
.btn-icon:active { transform:scale(0.95); background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.btn-icon svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.btn-icon.primary { background: var(--accent); color:#fff; border-color: var(--accent); box-shadow: 0 1px 3px rgba(37,99,235,0.3); }
.btn-icon.primary:active { background:#1d4ed8; border-color:#1d4ed8; }

.search-wrap {
  display:flex; align-items:center; gap:8px;
  background: var(--card-bg);
  border-radius: var(--radius-sm); padding: 0 12px; height: 40px;
  border: 1px solid var(--card-border);
}
.search-wrap svg { width:16px; height:16px; stroke:var(--text-tertiary); fill:none; stroke-width:2; flex-shrink:0; }
.search-input { flex:1; border:none; background:none; outline:none; font-size:15px; font-family:var(--font); color:var(--text); }
.search-input::placeholder { color:var(--text-tertiary); }

.tag-filter-area { display:flex; gap:8px; padding:8px 16px; overflow-x:auto; scrollbar-width:none; flex-shrink:0; }
.tag-filter-area::-webkit-scrollbar { display:none; }
.tag-chip {
  flex-shrink:0; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:500;
  background: var(--card-bg); border: 1px solid var(--card-border);
  cursor:pointer; transition: all 0.15s; white-space:nowrap; color: var(--text-secondary);
}
.tag-chip.active { background: var(--text); color:#fff; border-color:var(--text); }

.card-list { padding: 0 16px; flex:1; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 60px 20px; color: var(--text-tertiary); text-align:center; }
.empty-state p { font-size:15px; line-height:1.6; }

.haircut-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow);
  cursor: pointer; transition: all 0.15s; position: relative;
  overflow: hidden;
}
.haircut-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, #2563eb, #7c3aed, #db2777);
  opacity:0; transition: opacity 0.2s; z-index:0;
}
.haircut-card:hover::before, .haircut-card:active::before { opacity:1; }
.haircut-card > * { position:relative; z-index:1; }
.haircut-card:active { transform:scale(0.99); box-shadow: var(--shadow-lg); }
.card-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
.card-name { font-size:17px; font-weight:600; letter-spacing:-0.3px; }
.card-version { font-size:12px; color:var(--text-tertiary); margin-left:6px; font-weight:400; }
.card-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.card-tag { font-size:11px; padding:3px 8px; border-radius:6px; background: var(--accent-light); color: var(--accent); font-weight:500; }
.card-preview { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:8px; }
.card-preview-img { aspect-ratio:1; border-radius:var(--radius-xs); overflow:hidden; background:#f4f4f5; }
.card-preview-img img { width:100%; height:100%; object-fit:cover; }
.card-meta { font-size:12px; color:var(--text-tertiary); }
.card-actions { display:flex; gap:8px; margin-top:12px; }
.card-btn { flex:1; height:34px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; transition: all 0.15s; font-family:var(--font); }
.card-btn-edit { background: #f4f4f5; color: var(--text-secondary); border: 1px solid var(--card-border); }
.card-btn-edit:active { background: #e4e4e7; }
.card-btn-export { background: var(--accent); color:#fff; }
.card-btn-export:active { background: #1d4ed8; }
.card-delete {
  position:absolute; top:10px; right:14px; width:28px; height:28px; border-radius:50%;
  border:none; background:rgba(255,59,48,0.1); color:var(--danger); font-size:16px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  z-index:2; opacity:0; transition:opacity 0.2s;
}
.haircut-card:active .card-delete { opacity:1; }

/* ===== PREVIEW VIEW ===== */
.preview-header {
  position: sticky; top:0; z-index:100;
  display:flex; align-items:center; gap:8px;
  padding: 12px 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  background: rgba(250,250,250,0.85);
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  border-bottom: 1px solid var(--card-border);
}
.preview-header .btn-icon { width:36px; height:36px; font-size:16px; }
.preview-title { flex:1; font-size:16px; font-weight:600; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.preview-body { flex:1; overflow-y:auto; padding:16px; }
.preview-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.preview-tag { font-size:11px; padding:3px 8px; border-radius:6px; background: var(--accent-light); color: var(--accent); font-weight:500; }
.preview-section {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.preview-section-label { font-size:14px; font-weight:600; color:var(--text-secondary); margin-bottom:8px; }
.preview-section-photo { border-radius:var(--radius-xs); overflow:hidden; margin-bottom:8px; }
.preview-section-photo img { width:100%; display:block; }
.preview-section-text { font-size:14px; color:var(--text-secondary); line-height:1.6; white-space:pre-wrap; }
.preview-footer {
  padding:12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
  display:flex; gap:10px; border-top:1px solid var(--card-border);
  background: var(--card-bg);
}
.preview-footer .btn { flex:1; }

/* ===== EDIT VIEW ===== */
.edit-header {
  position: sticky; top:0; z-index:100;
  display:flex; align-items:center; gap:8px;
  padding: 12px 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  background: rgba(250,250,250,0.85);
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  border-bottom: 1px solid var(--card-border);
}
.edit-header .btn-icon { width:36px; height:36px; font-size:16px; }
.edit-title { flex:1; font-size:16px; font-weight:600; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.edit-body { flex:1; overflow-y:auto; padding:16px; }

.name-section { margin-bottom:16px; }
.name-row { display:flex; gap:8px; align-items:center; }
.name-input { flex:1; height:44px; border-radius:var(--radius-xs); border:1px solid var(--card-border); padding:0 12px; font-size:16px; font-family:var(--font); background:var(--card-bg); outline:none; transition: border-color 0.15s; }
.name-input:focus { border-color:var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.preset-select { height:44px; border-radius:var(--radius-xs); border:1px solid var(--card-border); padding:0 10px; font-size:14px; font-family:var(--font); background:var(--card-bg); outline:none; max-width:120px; }
.version-row { display:flex; align-items:center; gap:8px; margin-top:8px; }
.version-label { font-size:13px; color:var(--text-secondary); }
.version-input { width:56px; height:32px; border-radius:8px; border:1px solid rgba(0,0,0,0.1); text-align:center; font-size:14px; font-family:var(--font); background:rgba(255,255,255,0.45); outline:none; }

.section-tabs { display:flex; gap:0; margin-bottom:16px; background:#f4f4f5; border-radius:var(--radius-xs); padding:3px; overflow-x:auto; scrollbar-width:none; }
.section-tabs::-webkit-scrollbar { display:none; }
.section-tab { flex:1; min-width:56px; padding:8px 4px; text-align:center; font-size:12px; font-weight:500; border-radius:6px; border:none; background:none; cursor:pointer; color:var(--text-secondary); transition:all 0.15s; white-space:nowrap; font-family:var(--font); }
.section-tab.active { background:var(--card-bg); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,0.06); }

.section-content { display:none; }
.section-content.active { display:block; }
.section-label { font-size:14px; font-weight:600; color:var(--text-secondary); margin-bottom:10px; display:flex; align-items:center; gap:8px; }

.photo-area { position:relative; border-radius:var(--radius-xs); overflow:hidden; margin-bottom:12px; aspect-ratio:4/3; background:#f4f4f5; border:2px dashed var(--card-border); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.15s; }
.photo-area:active { border-color:var(--accent); background:var(--accent-light); }
.photo-area.has-photo { border-style:solid; border-color:transparent; }
.photo-area img { width:100%; height:100%; object-fit:cover; }
.photo-placeholder { text-align:center; color:var(--text-tertiary); pointer-events:none; }
.photo-placeholder span { font-size:13px; display:block; }
.photo-del-btn {
  position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%;
  background:var(--danger); color:#fff; border:none; font-size:12px; cursor:pointer;
  display:none; align-items:center; justify-content:center; z-index:3; line-height:1;
}
.photo-area.has-photo .photo-del-btn { display:flex; }
.photo-area.has-photo .photo-placeholder { display:none; }
.photo-replace {
  position:absolute; bottom:8px; right:8px; width:28px; height:28px; border-radius:50%;
  background:rgba(0,122,255,0.85); color:#fff; border:none; cursor:pointer;
  display:none; align-items:center; justify-content:center; z-index:2; padding:0;
}
.photo-replace svg { width:14px; height:14px; stroke:#fff; }
.photo-area.has-photo .photo-replace { display:flex; }

.sync-btn { display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.15s; border:1px solid var(--card-border); background:var(--card-bg); color:var(--accent); font-family:var(--font); }
.sync-btn:active { background:var(--accent-light); border-color:var(--accent); }
.sync-btn svg { width:14px; height:14px; }

.text-area { width:100%; min-height:80px; border-radius:var(--radius-xs); border:1px solid var(--card-border); padding:10px 12px; font-size:14px; font-family:var(--font); resize:vertical; background:var(--card-bg); outline:none; line-height:1.6; transition: border-color 0.15s; }
.text-area:focus { border-color:var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

.prompt-section { margin-top:12px; }
.prompt-toggle { font-size:13px; color:var(--accent); cursor:pointer; display:inline-flex; align-items:center; gap:4px; padding:4px 0; font-family:var(--font); }
.prompt-list { display:none; flex-wrap:wrap; gap:6px; margin-top:8px; }
.prompt-list.show { display:flex; }
.prompt-chip { font-size:12px; padding:5px 10px; border-radius:6px; background:#f4f4f5; border:1px solid var(--card-border); cursor:pointer; color:var(--text-secondary); transition:all 0.15s; font-family:var(--font); }
.prompt-chip:active { background:var(--accent); color:#fff; border-color:var(--accent); }

.tags-section { margin-top:20px; padding-top:16px; border-top:1px solid var(--card-border); }
.tags-label { font-size:14px; font-weight:600; margin-bottom:8px; color:var(--text-secondary); }
.tags-edit-row { display:flex; gap:8px; margin-bottom:8px; }
.tags-input { flex:1; height:36px; border-radius:var(--radius-xs); border:1px solid var(--card-border); padding:0 10px; font-size:14px; font-family:var(--font); background:var(--card-bg); outline:none; }
.tags-input:focus { border-color:var(--accent); }
.tag-add-btn { height:36px; padding:0 14px; border-radius:var(--radius-xs); border:none; background:var(--accent); color:#fff; font-size:13px; font-weight:500; cursor:pointer; font-family:var(--font); }
.tags-display { display:flex; gap:6px; flex-wrap:wrap; }
.edit-tag { display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:3px 10px; border-radius:6px; background:var(--accent-light); color:var(--accent); }
.edit-tag-remove { cursor:pointer; font-weight:700; font-size:14px; line-height:1; }

.edit-footer { padding:12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom, 12px)); display:flex; gap:10px; border-top:1px solid var(--card-border); background:var(--card-bg); }

.btn { flex:1; height:44px; border-radius:var(--radius-xs); border:none; font-size:14px; font-weight:600; cursor:pointer; transition:all 0.15s; font-family:var(--font); display:flex; align-items:center; justify-content:center; gap:6px; }
.btn-primary { background:var(--accent); color:#fff; box-shadow: 0 1px 3px rgba(37,99,235,0.3); }
.btn-primary:active { background:#1d4ed8; }
.btn-secondary { background:#f4f4f5; color:var(--text); border: 1px solid var(--card-border); }
.btn-secondary:active { background:#e4e4e7; }
.btn-danger { background:var(--danger-light); color:var(--danger); }
.btn-danger:active { background:rgba(239,68,68,0.15); }

/* Toast */
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; z-index:1000; opacity:0; transition:opacity 0.3s; pointer-events:none; font-family:var(--font); }
.toast.show { opacity:1; }

/* Photo fullscreen preview (only for preview page photos, not edit) */
.photo-fs-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.95); z-index:500; display:none; align-items:center; justify-content:center; }
.photo-fs-overlay.show { display:flex; }
.photo-fs-img-wrap { max-width:100vw; max-height:100vh; transform-origin:center center; }
.photo-fs-img-wrap img { max-width:100vw; max-height:100vh; object-fit:contain; display:block; }
.fs-close { position:fixed; top:max(16px, env(safe-area-inset-top, 16px)); right:16px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); border:none; color:#fff; font-size:18px; cursor:pointer; z-index:501; display:flex; align-items:center; justify-content:center; }

/* Onboarding */
.onboarding-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:600; display:none; align-items:center; justify-content:center; }
.onboarding-overlay.show { display:flex; }
.onboarding-card { background:rgba(255,255,255,0.75); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%); border:1px solid rgba(255,255,255,0.5); border-radius:var(--radius); padding:28px 24px; margin:20px; max-width:360px; width:100%; box-shadow:var(--shadow-lg); text-align:center; }
.onboarding-card h2 { font-size:20px; margin-bottom:12px; }
.onboarding-card p { font-size:14px; color:var(--text-secondary); line-height:1.6; margin-bottom:6px; }
.onboarding-step { display:none; }
.onboarding-step.active { display:block; }
.onboarding-dots { display:flex; gap:6px; justify-content:center; margin-top:16px; }
.onboarding-dot { width:8px; height:8px; border-radius:50%; background:rgba(0,0,0,0.1); transition:all 0.3s; }
.onboarding-dot.active { background:var(--accent); width:24px; border-radius:4px; }
#obNext { width: auto; min-width: 180px; margin: 20px auto 0; flex: none; display: block; }

/* Export preview modal */
.export-modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.92); z-index:800; display:none; flex-direction:column; align-items:center; justify-content:center; padding:16px; padding-top:max(50px,env(safe-area-inset-top,20px)); padding-bottom:max(80px,env(safe-area-inset-bottom,20px)); }
.export-modal-overlay.show { display:flex; }
.export-modal-close { position:fixed; top:max(16px,env(safe-area-inset-top,16px)); right:16px; z-index:801; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.15); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:none; color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.export-modal-hint { color:rgba(255,255,255,0.65); font-size:13px; margin-bottom:10px; font-family:var(--font); letter-spacing:0.5px; }
.export-modal-img-wrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; width:100%; }
.export-modal-img-wrap img { max-width:98%; max-height:100%; object-fit:contain; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.3); }
.export-modal-actions { display:flex; gap:10px; margin-top:12px; width:100%; max-width:320px; flex-shrink:0; }
.export-modal-actions .btn { flex:1; height:44px; font-size:14px; }

/* Confirm */
.confirm-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); z-index:700; display:none; align-items:center; justify-content:center; }
.confirm-overlay.show { display:flex; }
.confirm-dialog { background:#ffffff; border-radius:var(--radius); padding:24px; margin:20px; max-width:300px; width:100%; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,0.12); }
.confirm-dialog p { font-size:15px; margin-bottom:20px; line-height:1.5; }
.confirm-dialog .btn-row { display:flex; gap:10px; }
.confirm-dialog .btn { height:40px; font-size:14px; }

/* Loading */
.loading-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.35); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; opacity:0; transition:opacity 0.3s; }
.loading-overlay.show { opacity:1; pointer-events:auto; }
.loading-spinner { width:44px; height:44px; border:3px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
.loading-text { color:#fff; margin-top:12px; font-size:14px; }

@keyframes spin { to { transform:rotate(360deg); } }

/* Animations */
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.card-list .haircut-card { animation:slideUp 0.35s ease both; }
.card-list .haircut-card:nth-child(1) { animation-delay:0s; }
.card-list .haircut-card:nth-child(2) { animation-delay:0.05s; }
.card-list .haircut-card:nth-child(3) { animation-delay:0.1s; }
.card-list .haircut-card:nth-child(4) { animation-delay:0.15s; }
.card-list .haircut-card:nth-child(5) { animation-delay:0.2s; }
</style>
</head>
<body>
<div class="app-container" id="appContainer">

  <!-- ===== CATALOG VIEW ===== -->
  <div class="view active" id="catalogView">
    <div class="catalog-header">
      <div class="header-top">
        <span class="header-logo"><span>HaircutGet</span></span>

  }).join('');
}

function bindEvents() {
  $('#btnNew').addEventListener('click', createNewEntry);
  $('#btnRefresh').addEventListener('click', ()=>{ showLoading(true); setTimeout(refreshCatalog,400); });
  $('#btnImport').addEventListener('click', ()=>importFileInput.click());
  searchInput.addEventListener('input', renderCatalog);

  $('#btnPreviewBack').addEventListener('click', ()=>{ showView('catalog'); renderCatalog(); });
  $('#btnPreviewEdit').addEventListener('click', openEditFromPreview);
  $('#btnPreviewExport').addEventListener('click', ()=>exportFromPreview());

  $('#btnEditBack').addEventListener('click', goBackToPreview);
  $('#btnSave').addEventListener('click', saveEntry);
  $('#btnSaveAs').addEventListener('click', saveAsNew);
  $('#btnDelete').addEventListener('click', ()=>{
    const e=getCurrentEntry(); showConfirm(`确定删除「${e?.name||'未命名'}」？`,()=>{ entries=entries.filter(x=>x.id!==currentEntryId); saveEntries(entries); showToast('已删除'); showView('catalog'); renderCatalog(); });
  });

  sectionTabs.addEventListener('click', e => {
    const tab=e.target.closest('.section-tab'); if(!tab) return;
    currentSection=tab.dataset.section;
    sectionTabs.querySelectorAll('.section-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    sectionContents.querySelectorAll('.section-content').forEach(c=>c.classList.remove('active'));
    const t=sectionContents.querySelector(`[data-section="${currentSection}"]`); if(t) t.classList.add('active');
  });

  // Photo-area clicks: ONLY upload, no preview
  sectionContents.addEventListener('click', e => {
    const syncBtn=e.target.closest('.sync-btn');
    if(syncBtn){ const f=syncBtn.dataset.syncFrom, t=syncBtn.dataset.syncTo; syncSection(f,t); showToast(`已同步到${SECTION_LABELS[t]}`); return; }
    const delBtn=e.target.closest('[data-action="del-photo"]');
    if(delBtn){ e.stopPropagation(); setSectionPhoto(delBtn.dataset.photoKey,''); showToast('照片已删除'); return; }
    const repBtn=e.target.closest('[data-action="rep-photo"]');
    if(repBtn){ e.stopPropagation(); triggerPhotoUpload(repBtn.dataset.photoKey); return; }
    const pa=e.target.closest('.photo-area');
    if(pa){ triggerPhotoUpload(pa.dataset.photoKey); }
  });

  // Preview-body photo click -> fullscreen
  previewBody.addEventListener('click', e => {
    const img = e.target.closest('img');
    if(!img || !img.src || img.src.endsWith('#')) return;
    fsImg.src = img.src; fsScale = 1; fsImgWrap.style.transform = 'scale(1)';
    fsOverlay.classList.add('show');
  });

  // Fullscreen close
  $('#fsClose').addEventListener('click', closeFsPreview);
  fsOverlay.addEventListener('click', e => { if(e.target===fsOverlay) closeFsPreview(); });

  // Pinch zoom on fullscreen
  let pDist=0, pScale=1;
  fsImgWrap.addEventListener('touchstart', e=>{ if(e.touches.length===2){ pDist=getPinchDist(e.touches); pScale=fsScale; } });
  fsImgWrap.addEventListener('touchmove', e=>{ if(e.touches.length===2){ e.preventDefault(); fsScale=Math.max(0.5,Math.min(5,pScale*(getPinchDist(e.touches)/pDist))); fsImgWrap.style.transform=`scale(${fsScale})`; } });
  fsImgWrap.addEventListener('touchend', ()=>{ if(fsScale<0.95) closeFsPreview(); });

  presetSelect.addEventListener('change', ()=>{
    const v=presetSelect.value; if(!v) return;
    const p=PRESET_HAIRSTYLES.find(h=>h.name===v);
    if(p){ nameInput.value=p.name;
      SECTION_KEYS.forEach(k=>{ const t=sectionContents.querySelector(`[data-text-key="${k}"]`); if(t&&p.sections[k]) t.value=p.sections[k]; });
    }
  });

  $('#tagAddBtn').addEventListener('click', addTag);
  tagsInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTag(); } });
  hiddenFileInput.addEventListener('change', handleFileSelect);
  importFileInput.addEventListener('change', handleImportFile);
  $('#confirmCancel').addEventListener('click', ()=>confirmOverlay.classList.remove('show'));
  $('#confirmOk').addEventListener('click', ()=>{ confirmOverlay.classList.remove('show'); if(confirmCallback){ confirmCallback(); confirmCallback=null; } });
  $('#obNext').addEventListener('click', onboardingNext);
}

function getPinchDist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
function closeFsPreview(){ fsOverlay.classList.remove('show'); fsScale=1; fsImgWrap.style.transform='scale(1)'; fsImg.src=''; }

// ==================== CATALOG ====================
function renderCatalog() {
  const q = searchInput.value.trim().toLowerCase();
  let filtered = [...entries];
  if(q) filtered = filtered.filter(e=>e.name.toLowerCase().includes(q)||e.tags.some(t=>t.toLowerCase().includes(q)));
  const ac = tagFilterArea.querySelector('.tag-chip.active');
  if(ac&&ac.dataset.tag) filtered = filtered.filter(e=>e.tags.includes(ac.dataset.tag));
  filtered.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  renderTagChips();
  if(!filtered.length){ cardList.innerHTML=''; cardList.appendChild(emptyState); emptyState.style.display='flex'; }
  else {
    emptyState.style.display='none';
    cardList.innerHTML = filtered.map(e => {
      const previews = SECTION_KEYS.filter(k=>e.sections[k]&&e.sections[k].photo).slice(0,3).map(k=>`<div class="card-preview-img"><img src="${e.sections[k].photo}" alt=""></div>`).join('');
      return `<div class="haircut-card" data-id="${e.id}" onclick="openPreview('${e.id}')">
        <button class="card-delete" onclick="event.stopPropagation();deleteEntry('${e.id}')">✕</button>
        <div class="card-header"><span class="card-name">${e.name||'未命名'}<span class="card-version">v${e.version}</span></span></div>
        ${e.tags.length?`<div class="card-tags">${e.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>`:''}
        ${previews?`<div class="card-preview">${previews}</div>`:''}
        <div class="card-meta">${new Date(e.updatedAt).toLocaleDateString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="card-btn card-btn-edit" onclick="openEdit('${e.id}')">编辑</button>
          <button class="card-btn card-btn-export" onclick="quickExport('${e.id}')">导出图片</button>
        </div>
      </div>`;
    }).join('');
  }
}

function renderTagChips() {
  const allTags = new Set(); entries.forEach(e=>e.tags.forEach(t=>allTags.add(t)));
  const activeTag = (tagFilterArea.querySelector('.tag-chip.active')||{}).dataset?.tag||'';
  tagFilterArea.innerHTML = `<span class="tag-chip ${!activeTag?'active':''}" data-tag="" onclick="filterByTag('')">全部</span>`+[...allTags].map(t=>`<span class="tag-chip ${activeTag===t?'active':''}" data-tag="${t}" onclick="filterByTag('${t.replace(/'/g,"\\'")}')">${t}</span>`).join('');
}
function filterByTag(){ renderCatalog(); }
function refreshCatalog(){ entries=loadEntries(); renderCatalog(); showLoading(false); showToast('列表已刷新'); }
function deleteEntry(id){
  const e=entries.find(x=>x.id===id); if(!e) return;
  showConfirm(`确定删除「${e.name||'未命名'}」？`,()=>{ entries=entries.filter(x=>x.id!==id); saveEntries(entries); renderCatalog(); showToast('已删除'); });
}
function quickExport(id){ currentEntryId=id; exportFromPreview(); }

// ==================== VIEW NAVIGATION ====================
function showView(name){
  catalogView.classList.toggle('active', name==='catalog');
  previewView.classList.toggle('active', name==='preview');
  editView.classList.toggle('active', name==='edit');
}
function openPreview(id){ currentEntryId=id; renderPreview(); showView('preview'); }
function openEdit(id){ currentEntryId=id; loadEditForm(); showView('edit'); }
function openEditFromPreview(){ loadEditForm(); showView('edit'); }
function goBackToPreview(){ renderPreview(); showView('preview'); }
function createNewEntry(){ currentEntryId=null; editingTags=[]; editTitle.textContent='新建发型'; nameInput.value=''; presetSelect.value=''; versionInput.value='1'; clearAllSections(); renderTags(); switchSection('bangs'); showView('edit'); }

// ==================== PREVIEW ====================
function renderPreview(){
  const e=entries.find(x=>x.id===currentEntryId); if(!e) return;
  previewTitle.textContent=e.name||'未命名';

    <div style="text-align:center;margin-bottom:4px;"><strong style="font-size:18px;">${e.name||'未命名'}</strong></div>

    ${e.tags.length?`<div class="preview-tags">${e.tags.map(t=>`<span class="preview-tag">${t}</span>`).join('')}</div>`:''}
    ${SECTION_KEYS.map(k=>{

// ==================== EDIT ====================
function loadEditForm(){
  const e=entries.find(x=>x.id===currentEntryId);
  if(!e){ nameInput.value=''; presetSelect.value=''; versionInput.value='1'; editingTags=[]; clearAllSections(); editTitle.textContent='新建发型'; renderTags(); switchSection('bangs'); return; }
  editTitle.textContent=e.name||'未命名'; nameInput.value=e.name||''; presetSelect.value=''; versionInput.value=e.version||1; editingTags=[...e.tags]; renderTags();
  SECTION_KEYS.forEach(k=>{ const s=e.sections[k]||{photo:'',text:''}; setSectionPhoto(k,s.photo||''); const t=sectionContents.querySelector(`[data-text-key="${k}"]`); if(t) t.value=s.text||''; });
  switchSection('bangs');
}
function getCurrentEntry(){ return currentEntryId?entries.find(e=>e.id===currentEntryId):null; }
function collectEntryData(){
  const sec={}; SECTION_KEYS.forEach(k=>{ const ph=sectionContents.querySelector(`[data-photo-key="${k}"] img`); const tx=sectionContents.querySelector(`[data-text-key="${k}"]`); sec[k]={photo:(ph&&ph.src&&!ph.src.endsWith('#'))?ph.src:'',text:tx?tx.value:''}; });
  return { name:nameInput.value.trim(), version:parseInt(versionInput.value)||1, tags:[...editingTags], sections:sec, updatedAt:new Date().toISOString() };
}
function saveEntry(){
  const data=collectEntryData(); if(!data.name){ showToast('请输入发型名称'); nameInput.focus(); return; }
  let entry;
  if(currentEntryId){ entry=entries.find(e=>e.id===currentEntryId); if(!entry) return; Object.assign(entry,data); }
  else { entry={...createEmptyEntry(),...data}; entries.push(entry); currentEntryId=entry.id; }
  saveEntries(entries); editTitle.textContent=entry.name||'未命名'; showToast('保存成功');
  renderPreview(); showView('preview');
}
function saveAsNew(){
  const data=collectEntryData(); if(!data.name){ showToast('请输入发型名称'); nameInput.focus(); return; }
  const maxVer=entries.filter(e=>e.name===data.name).reduce((m,e)=>Math.max(m,e.version||1),0);
  const ne={...createEmptyEntry(),...data,version:maxVer+1,updatedAt:new Date().toISOString()};
  entries.push(ne); currentEntryId=ne.id; versionInput.value=ne.version;
  saveEntries(entries); editTitle.textContent=ne.name||'未命名'; showToast(`已另存为 v${ne.version}`);
  renderPreview(); showView('preview');
}

// ==================== SECTIONS ====================
function switchSection(k){ currentSection=k; sectionTabs.querySelectorAll('.section-tab').forEach(t=>t.classList.toggle('active',t.dataset.section===k)); sectionContents.querySelectorAll('.section-content').forEach(c=>c.classList.toggle('active',c.dataset.section===k)); }
function clearAllSections(){ SECTION_KEYS.forEach(k=>{ setSectionPhoto(k,''); const t=sectionContents.querySelector(`[data-text-key="${k}"]`); if(t) t.value=''; }); }
function setSectionPhoto(key,src){ const a=sectionContents.querySelector(`[data-photo-key="${key}"]`); if(!a) return; const img=a.querySelector('img'); if(src){ img.src=src; img.style.display='block'; a.classList.add('has-photo'); } else { img.src=''; img.style.display='none'; a.classList.remove('has-photo'); } }
function syncSection(from,to){ const ft=sectionContents.querySelector(`[data-text-key="${from}"]`); const tt=sectionContents.querySelector(`[data-text-key="${to}"]`); if(ft&&tt) tt.value=ft.value; const fi=sectionContents.querySelector(`[data-photo-key="${from}"] img`); if(fi&&fi.src&&!fi.src.endsWith('#')) mirrorImage(fi.src).then(s=>setSectionPhoto(to,s)); else setSectionPhoto(to,''); }
function mirrorImage(src){ return new Promise(resolve=>{ const img=new Image(); img.crossOrigin='anonymous'; img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.width; c.height=img.height; const ctx=c.getContext('2d'); ctx.translate(c.width,0); ctx.scale(-1,1); ctx.drawImage(img,0,0); resolve(c.toDataURL('image/jpeg',0.85)); }; img.onerror=()=>resolve(src); img.src=src; }); }

// ==================== PHOTO UPLOAD ====================
function triggerPhotoUpload(key){ pendingPhotoKey=key; hiddenFileInput.click(); }
function handleFileSelect(e){
  const file=e.target.files[0]; if(!file||!pendingPhotoKey) return;
  const reader=new FileReader();
  reader.onload=ev=>{ compressImage(ev.target.result,1200,0.8).then(c=>{ setSectionPhoto(pendingPhotoKey,c); pendingPhotoKey=null; hiddenFileInput.value=''; }); };
  reader.readAsDataURL(file);
}
function compressImage(src,max,quality){ return new Promise(resolve=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>max||h>max){ const r=Math.min(max/w,max/h); w*=r; h*=r; } const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); resolve(c.toDataURL('image/jpeg',quality)); }; img.onerror=()=>resolve(src); img.src=src; }); }

// ==================== EXPORT: Cube-net cross layout (landscape) ====================
// Layout:
//              [后脑勺/back]
// [左侧面/left] [头顶/top] [右侧面/right]
//              [正面/front]
//              [刘海/bangs]
// High-res 2x, JPEG output, NO card borders, big photos
const SCALE = 2;
const FACE_W = 260;
const FACE_H = 360;
const FACE_GAP = 14;
const MARGIN = 24;
const HEADER_H = 150;
const FOOTER_H = 160;
const CANVAS_BASE_W = MARGIN*2 + FACE_W*3 + FACE_GAP*2;
const CANVAS_BASE_H = MARGIN + HEADER_H + FACE_H*4 + FACE_GAP*3 + FOOTER_H + MARGIN;

const facePos = {
  back:     { col: 1, row: 0 },
  leftSide: { col: 0, row: 1 },
  top:      { col: 1, row: 1 },
  rightSide:{ col: 2, row: 1 },
  front:    { col: 1, row: 2 },
  bangs:    { col: 1, row: 3 },
};

// ==================== ★★★ 二维码网址配置 ★★★ ====================
// ↓↓↓ 当前二维码指向的网址 ↓↓↓
// QR_URL = https://haircut-get.netlify.app
// ↑↑↑ 要更换网址：修改上面 gen_qr_matrix.py 里的 url，运行 python3 gen_qr_matrix.py，复制生成的新矩阵到这里 ↑↑↑
// ================================================================
// 矩阵由 Python qrcode 库生成 (Version 3, M-EC, 29×29)
const QR_MATRIX = [
'11111110110001101000001111111',
'10000010010111110001001000001',
'10111010001000100100101011101',
'10111010110000000010001011101',
'10111010100100000110001011101',
'10000010110010001001101000001',
'11111110101010101010101111111',
'00000000100011011101100000000',
'10001011110011000100111111001',
'10000100101001101110001111111',
'00101010011100001100011110001',
'10101101010110100111100101011',
'01110011111011111100110100010',
'11101100110100000010111111111',
'10110011001001110010001001101',
'10100101000101011100101110011',
'10111111110011000101010000010',
'10011000000111101100011111011',
'00010010000010001100101000101',
'00100000111110100110111100011',
'11101011010001110111111111001',
'00000000100110000111100010001',
'11111110110011111011101011101',
'10000010000011011101100010000',
'10111010101101001101111111011',
'10111010010100111010000000010',
'10111010010011011101010001111',
'10000010011110111110100101011',
'11111110110000001100110001010'
];
const QR_SIZE = 120; // base px — 够大才扫得出来

function faceCX(col) { return MARGIN + col*(FACE_W+FACE_GAP) + FACE_W/2; }
function faceCY(row) { return MARGIN+HEADER_H + row*(FACE_H+FACE_GAP) + FACE_H/2; }

async function exportFromPreview() {
  const entry = entries.find(e=>e.id===currentEntryId);
  if(!entry){ showToast('请先保存发型'); return; }
  showLoading(true, '正在生成高清预览图...');

  const totalH = CANVAS_BASE_H;

  const canvas = document.createElement('canvas');
  canvas.width = CANVAS_BASE_W * SCALE;
  canvas.height = totalH * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);

  // === Background ===
  ctx.fillStyle = '#f8f9fb';
  ctx.fillRect(0, 0, CANVAS_BASE_W, totalH);

  // === HEADER: symmetric whitespace ===
  // separatorY splits header into 2 equal halves
  const separatorY = MARGIN + 75; // = 99 (75px above, 75px below in header)

  // Top-left: HaircutGet brand
  const brandGrad = ctx.createLinearGradient(MARGIN, 0, MARGIN+160, 0);
  brandGrad.addColorStop(0, '#2563eb');
  brandGrad.addColorStop(0.5, '#7c3aed');
  brandGrad.addColorStop(1, '#db2777');
  ctx.fillStyle = brandGrad;
  ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('HaircutGet', MARGIN, separatorY - 30); // baseline 30px above separator

  // Subtitle below brand
  ctx.fillStyle = 'rgba(100,100,110,0.4)';
  ctx.font = '400 12px -apple-system, sans-serif';
  ctx.fillText('剪发需求记录工具', MARGIN, separatorY - 12);

  // Separator line — at exact midpoint
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(MARGIN, separatorY); ctx.lineTo(CANVAS_BASE_W-MARGIN, separatorY); ctx.stroke();

  // Hairstyle name — below separator
  ctx.fillStyle = '#1e1e24';
  ctx.font = 'bold 18px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(entry.name||'未命名', CANVAS_BASE_W/2, separatorY + 22);

  // Tags
  if(entry.tags.length) {
    const tagsText = entry.tags.map(t=>'#'+t).join(' ');
    ctx.fillStyle = '#6b7280';
    ctx.font = '500 11px -apple-system, sans-serif';
    ctx.fillText(tagsText, CANVAS_BASE_W/2, separatorY + 44);
  }

  const startY = MARGIN + HEADER_H;

  // === Draw connectors ===
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  const connectors = [
    [faceCX(1), faceCY(0)+FACE_H/2, faceCX(1), faceCY(1)-FACE_H/2],
    [faceCX(1)-FACE_W/2, faceCY(1), faceCX(0)+FACE_W/2, faceCY(1)],
    [faceCX(1)+FACE_W/2, faceCY(1), faceCX(2)-FACE_W/2, faceCY(1)],
    [faceCX(1), faceCY(1)+FACE_H/2, faceCX(1), faceCY(2)-FACE_H/2],
    [faceCX(1), faceCY(2)+FACE_H/2, faceCX(1), faceCY(3)-FACE_H/2],
  ];
  connectors.forEach(([x1,y1,x2,y2]) => { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); });
  ctx.setLineDash([]);

  // === Draw each face (no card, big photo + text) ===
  for(const key of SECTION_KEYS) {
    const pos = facePos[key];
    const x = MARGIN + pos.col * (FACE_W + FACE_GAP);
    const y = startY + pos.row * (FACE_H + FACE_GAP);
    const s = entry.sections[key] || {photo:'', text:''};
    try {
      await drawFaceClean(ctx, x, y, FACE_W, FACE_H, SECTION_LABELS[key], s.photo, s.text||'');
    } catch(e) {
      // 单张图片加载失败时用占位替代，不阻塞整体导出
      drawFaceCleanFallback(ctx, x, y, FACE_W, FACE_H, SECTION_LABELS[key], s.text||'');
    }
  }

  // === FOOTER with QR Code ===
  const bottomY = startY + FACE_H*4 + FACE_GAP*3;
  const footerPadTop = 15;

  // === Render pre-computed QR Code ===
  const qrMatrix = QR_MATRIX;
  const qrX = CANVAS_BASE_W - MARGIN - QR_SIZE;
  const qrY = bottomY + footerPadTop;
  const qrMod = QR_SIZE / 29;

  // Draw QR modules with gradient
  const qrGrad = ctx.createLinearGradient(qrX, qrY, qrX + QR_SIZE, qrY + QR_SIZE);
  qrGrad.addColorStop(0, '#2563eb');
  qrGrad.addColorStop(0.5, '#7c3aed');
  qrGrad.addColorStop(1, '#db2777');

  for (let r = 0; r < 29; r++) {
    const row = qrMatrix[r];
    for (let c = 0; c < 29; c++) {
      if (row[c] === '1') {
        ctx.fillStyle = qrGrad;
        ctx.fillRect(qrX + c * qrMod, qrY + r * qrMod, qrMod + 0.5, qrMod + 0.5);
      }
    }
  }

  // QR white border
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.strokeRect(qrX - 4, qrY - 4, QR_SIZE + 8, QR_SIZE + 8);
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 1;
  ctx.strokeRect(qrX - 4, qrY - 4, QR_SIZE + 8, QR_SIZE + 8);

  // Center logo — "HaircutGet" inside QR
  const logoRatio = 0.28;
  const logoW = QR_SIZE * logoRatio;
  const logoH = QR_SIZE * logoRatio * 0.55;
  const logoX = qrX + (QR_SIZE - logoW) / 2;
  const logoY = qrY + (QR_SIZE - logoH) / 2;

  ctx.fillStyle = '#ffffff';
  roundRect(ctx, logoX, logoY, logoW, logoH, 5);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 0.5;
  roundRect(ctx, logoX, logoY, logoW, logoH, 5);
  ctx.stroke();

  const logoGrad = ctx.createLinearGradient(logoX, logoY, logoX + logoW, logoY);
  logoGrad.addColorStop(0, '#2563eb');
  logoGrad.addColorStop(0.5, '#7c3aed');
  logoGrad.addColorStop(1, '#db2777');
  ctx.fillStyle = logoGrad;
  ctx.font = `bold ${Math.round(logoH * 0.55)}px -apple-system, "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('HaircutGet', qrX + QR_SIZE / 2, qrY + QR_SIZE / 2);

  // --- Date & version text (left of QR) ---
  ctx.fillStyle = 'rgba(100,100,110,0.5)';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const dateStr = `v${entry.version} · ${new Date(entry.updatedAt).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}`;
  ctx.fillText(dateStr, MARGIN, qrY + QR_SIZE - 20);
  ctx.fillText('扫码查看剪发需求 →', MARGIN, qrY + QR_SIZE - 40);

  // Small brand at very bottom
  ctx.fillStyle = 'rgba(100,100,110,0.35)';
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Powered by HaircutGet', CANVAS_BASE_W / 2, bottomY + FOOTER_H - 14);

  // === DATA ENCODING STRIP (bottom of image, JPEG-resistant blocks) ===
  // Compute photo coordinates at base scale for each face section
  const faceCoords = {};
  for(const key of SECTION_KEYS) {
    const pos = facePos[key];
    const fx = MARGIN + pos.col * (FACE_W + FACE_GAP);
    const fy = MARGIN + HEADER_H + pos.row * (FACE_H + FACE_GAP);
    const PAD = 8;
    // drawFaceClean places photo at: (fx+PAD, fy+24), size: (innerW, photoH)
    faceCoords[key] = {
      x: fx + PAD,
      y: fy + 24,
      w: FACE_W - PAD*2,
      h: Math.round((FACE_H - 24 - 8) * 0.72)
    };
  }
  const dataJson = JSON.stringify({
    f:2,  // format version
    n: entry.name, v: entry.version, tg: entry.tags,
    fs: SECTION_KEYS.reduce((acc,k)=>{ acc[k]={t:entry.sections[k]?entry.sections[k].text||'':''}; return acc; }, {}),
    fc: faceCoords,
  });
  const stripW = CANVAS_BASE_W * SCALE;
  const encoded = encodeBlocks(dataJson, stripW);
  const stripH = encoded.length;

  const finalCanvas = document.createElement('canvas');
  finalCanvas.width = stripW;
  finalCanvas.height = totalH * SCALE + stripH;
  const fctx = finalCanvas.getContext('2d');
  fctx.drawImage(canvas, 0, 0);
  for(let row=0; row<stripH; row++) {
    const rowData = encoded[row];
    for(let col=0; col<rowData.length; col++) {
      fctx.fillStyle = rowData[col];
      fctx.fillRect(col, totalH*SCALE + row, 1, 1);
    }
  }

  const filename = `${entry.name||'haircut'}_v${entry.version||1}.jpg`;

  // === Mobile download: JPEG for iOS compatibility ===
  try {
    const blob = await Promise.race([
      new Promise(r => finalCanvas.toBlob(r, 'image/jpeg', 0.92)),
      new Promise((_, reject) => setTimeout(() => reject(new Error('blob timeout')), 10000))
    ]);

    // Web Share API (iOS 14+ / Android)
    if (navigator.share && navigator.canShare) {
      const file = new File([blob], filename, { type: 'image/jpeg' });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: filename });
          showLoading(false);
          showToast('已分享，可保存到相册');
          return;
        } catch(e) { /* fall through */ }
      }
    }

    // Fallback: show image for long-press save
    const url = URL.createObjectURL(blob);
    showExportModal(url, filename);

    // Programmatic download (Android Chrome)
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);

    showLoading(false);
    showToast('长图已生成，长按保存');
  } catch(e) {
    const url = finalCanvas.toDataURL('image/jpeg', 0.92);
    showExportModal(url, filename);
    showLoading(false);
    showToast('长图已生成，长按保存');
  }
}

async function drawFaceClean(ctx, x, y, w, h, label, photoSrc, text) {
  const PAD = 8;
  const innerW = w - PAD*2;
  const innerX = x + PAD;

  // Label at top
  ctx.fillStyle = '#6b7280';
  ctx.font = '600 12px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(label, innerX, y+16);

  // Accent dot
  ctx.fillStyle = '#2563eb';
  ctx.beginPath(); ctx.arc(innerX-4, y+12, 3, 0, Math.PI*2); ctx.fill();

  let innerY = y + 24;

  if(photoSrc) {
    // Photo takes ~72% of remaining height
    const availH = (y + h) - innerY - 8;
    const photoH = Math.round(availH * 0.72);
    const photoW = innerW;
    try {
      const pImg = await loadImg(photoSrc);
      ctx.save();

      // Rounded rect clip
      ctx.beginPath();
      ctx.moveTo(innerX+6, innerY); ctx.lineTo(innerX+photoW-6, innerY);
      ctx.quadraticCurveTo(innerX+photoW, innerY, innerX+photoW, innerY+6);
      ctx.lineTo(innerX+photoW, innerY+photoH-6);
      ctx.quadraticCurveTo(innerX+photoW, innerY+photoH, innerX+photoW-6, innerY+photoH);
      ctx.lineTo(innerX+6, innerY+photoH);
      ctx.quadraticCurveTo(innerX, innerY+photoH, innerX, innerY+photoH-6);
      ctx.lineTo(innerX, innerY+6);
      ctx.quadraticCurveTo(innerX, innerY, innerX+6, innerY);
      ctx.closePath();
      ctx.clip();

      // Cover crop
      const imgRatio = pImg.width / pImg.height;
      const boxRatio = photoW / photoH;
      let sx=0, sy=0, sw=pImg.width, sh=pImg.height;
      if (imgRatio > boxRatio) { sw = pImg.height * boxRatio; sx = (pImg.width - sw) / 2; }
      else { sh = pImg.width / boxRatio; sy = (pImg.height - sh) / 2; }
      ctx.drawImage(pImg, sx, sy, sw, sh, innerX, innerY, photoW, photoH);
      ctx.restore();
    } catch(e) {
      ctx.fillStyle = '#f1f3f5';
      ctx.fillRect(innerX, innerY, photoW, photoH);
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.font = '11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('无照片', innerX+photoW/2, innerY+photoH/2+4);
      ctx.textAlign = 'left';
    }
    innerY += photoH + 6;
  }

  // Text below photo
  const remainingH = (y + h) - innerY - 4;
  ctx.fillStyle = '#374151';
  ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'left';
  const lines = wrapText(ctx, text||'暂无描述', innerW);
  const maxLines = Math.floor(remainingH / 14);
  lines.slice(0, maxLines).forEach((line, i) => {
    ctx.fillText(line, innerX, innerY+10+i*14);
  });
  if(lines.length > maxLines) {
    ctx.fillStyle = '#9ca3af';
    ctx.fillText('…', innerX, innerY+10+maxLines*14);
  }
}

function wrapText(ctx, text, maxW) {
  const lines = []; const paragraphs = text.split('\n');
  for(const para of paragraphs) {
    if(!para.trim()) { lines.push(''); continue; }
    let line = '';
    for(const ch of para) {
      if(ctx.measureText(line+ch).width > maxW && line) { lines.push(line); line=ch; }
      else line += ch;
    }
    if(line) lines.push(line);
  }
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ==================== BLOCK-BASED DATA ENCODING (JPEG-resistant) ====================
// Uses block-based encoding: black=1, white=0. Large blocks survive JPEG re-compression.
// BLOCK size auto-detected during import; export uses 20px for new images.
const EXPORT_BLOCK = 20;
const IMPORT_BLOCKS = [10, 20]; // try both — 10 for legacy images, 20 for new

function encodeBlocks(jsonStr, imgWidth) {
  const BLOCK = EXPORT_BLOCK;
  const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
  let bits = '';
  for(let i=0; i<base64.length; i++) bits += base64.charCodeAt(i).toString(2).padStart(8,'0');

  const bitsPerRow = Math.floor(imgWidth / BLOCK);
  const rows = Math.ceil(bits.length / bitsPerRow);
  const result = [];

  for(let r=0; r<rows; r++) {
    for(let pr=0; pr<BLOCK; pr++) {
      const rowColors = [];
      for(let c=0; c<bitsPerRow; c++) {
        const idx = r*bitsPerRow + c;
        const color = (idx < bits.length && bits[idx]==='1') ? 'rgb(0,0,0)' : 'rgb(255,255,255)';
        for(let pc=0; pc<BLOCK; pc++) rowColors.push(color);
      }
      // Pad to full imgWidth with white to prevent edge artifacts
      while(rowColors.length < imgWidth) rowColors.push('rgb(255,255,255)');
      result.push(rowColors);
    }
  }
  return result;
}

function decodeBlocks(imageData, imgWidth, stripStartRow, stripPixelRows) {
  const data = imageData.data;
  const totalRows = Math.floor(data.length / 4 / imgWidth);

  // Try each BLOCK size: 10 for legacy images, 20 for new
  // Also try ±3 rows offset for JPEG shift tolerance
  for(const BLOCK of IMPORT_BLOCKS) {
    const blocksPerRow = Math.floor(imgWidth / BLOCK);
    const totalBlockRows = Math.floor(stripPixelRows / BLOCK);

    if(blocksPerRow <= 0 || totalBlockRows <= 0) continue;

    console.log('[decode] BLOCK=%d blocksPerRow=%d blockRows=%d stripStart=%d', BLOCK, blocksPerRow, totalBlockRows, stripStartRow);

    // Multiple sampling strategies for JPEG resilience
    const strategies = [
      { name:'center', rOffset:Math.floor(BLOCK/4), rLen:BLOCK-Math.floor(BLOCK/4)*2 },
      { name:'top', rOffset:0, rLen:Math.floor(BLOCK/2) },
      { name:'full', rOffset:0, rLen:BLOCK },
    ];

    // Quick check: try center strategy first; if it yields 0 candidates, skip this BLOCK size
    let quickBits = '';
    for(let br=0; br<Math.min(totalBlockRows, 10); br++) {
      for(let bc=0; bc<blocksPerRow; bc++) {
        const startR = stripStartRow + br*BLOCK + Math.floor(BLOCK/4);
        const endR = Math.min(startR + BLOCK - Math.floor(BLOCK/4)*2, stripStartRow + stripPixelRows);
        const startC = bc*BLOCK + Math.floor(BLOCK/4);
        const endC = Math.min((bc+1)*BLOCK - Math.floor(BLOCK/4), imgWidth);
        let sum = 0, count = 0;
        for(let r=startR; r<endR; r++) {
          for(let c=startC; c<endC; c++) {
            if(r>=0 && r<totalRows && c>=0 && c<imgWidth) {
              const idx = (r*imgWidth + c)*4;
              sum += data[idx] + data[idx+1] + data[idx+2];
              count += 3;
            }
          }
        }
        quickBits += (count>0 && sum/count < 128) ? '1' : '0';
      }
    }
    // Quick validation: if first 80 bits produce no base64 chars, skip this BLOCK
    if(quickBits.length >= 80) {
      let validCount = 0;
      for(let i=0; i+7 < quickBits.length; i+=8) {
        const ch = String.fromCharCode(parseInt(quickBits.substring(i,i+8),2));
        if(/[A-Za-z0-9+/=]/.test(ch)) validCount++;
      }
      if(validCount < 3) {
        console.log('[decode] BLOCK=%d SKIPPED (only %d valid base64 chars in first 10 rows)', BLOCK, validCount);
        continue;
      }
    }

    for(const strat of strategies) {
      // Try multiple row offsets (±2) for JPEG shift
      for(let rowOff = 0; rowOff <= 2; rowOff++) {
        const offsets = rowOff === 0 ? [0] : [-rowOff, rowOff];
        for(const off of offsets) {
          const adjStart = stripStartRow + off;
          let bits = '';
          for(let br=0; br<totalBlockRows; br++) {
            for(let bc=0; bc<blocksPerRow; bc++) {
              const startR = Math.max(0, adjStart + br*BLOCK + strat.rOffset);
              const endR = Math.min(startR + strat.rLen, adjStart + stripPixelRows, totalRows);
              const startC = bc*BLOCK + Math.floor(BLOCK/4);
              const endC = Math.min((bc+1)*BLOCK - Math.floor(BLOCK/4), imgWidth);

              let sum = 0, count = 0;
              for(let r=startR; r<endR; r++) {
                for(let c=startC; c<endC; c++) {
                  if (r >= 0 && r < totalRows && c >= 0 && c < imgWidth) {
                    const idx = (r*imgWidth + c)*4;
                    sum += data[idx] + data[idx+1] + data[idx+2];
                    count += 3;
                  }
                }
              }
              bits += (count>0 && sum/count < 128) ? '1' : '0';
            }
          }

          const result = tryDecodeBits(bits);
          if (result) {
            console.log('[decode] SUCCESS BLOCK=%d strategy=%s offset=%d', BLOCK, strat.name, off);
            return result;
          }
        }
      }
      console.log('[decode] BLOCK=%d strategy=%s FAILED', BLOCK, strat.name);
    }

    // Threshold variation as last resort for this BLOCK size
    for(let thresh = 80; thresh <= 160; thresh += 10) {
      let bits = '';
      for(let br=0; br<totalBlockRows; br++) {
        for(let bc=0; bc<blocksPerRow; bc++) {
          const startR = stripStartRow + br*BLOCK + Math.floor(BLOCK/4);
          const endR = Math.min(startR + BLOCK - Math.floor(BLOCK/4)*2, stripStartRow + stripPixelRows);
          const startC = bc*BLOCK + Math.floor(BLOCK/4);
          const endC = Math.min((bc+1)*BLOCK - Math.floor(BLOCK/4), imgWidth);
          let sum = 0, count = 0;
          for(let r=startR; r<endR; r++) {
            for(let c=startC; c<endC; c++) {
              if (r>=0 && r<totalRows && c>=0 && c<imgWidth) {
                const idx = (r*imgWidth + c)*4;
                sum += data[idx] + data[idx+1] + data[idx+2];
                count += 3;
              }
            }
          }
          bits += (count>0 && sum/count < thresh) ? '1' : '0';
        }
      }
      const result = tryDecodeBits(bits);
      if (result) {
        console.log('[decode] SUCCESS BLOCK=%d threshold=%d', BLOCK, thresh);
        return result;
      }
    }
  }

  console.log('[decode] ALL BLOCK sizes & strategies exhausted');
  return null;
}

function tryDecodeBits(bits) {
  // Robust: collect ALL maximal valid-base64 substrings, try each candidate.
  // This survives JPEG artifacts because a few wrong bits only split candidates,
  // and the correct data is the longest valid base64 run.
  const bytes = [];
  for(let i=0; i+7 < bits.length; i+=8) {
    bytes.push(parseInt(bits.substring(i, i+8), 2));
  }

  // Collect consecutive valid base64 char sequences (min 8 chars)
  const candidates = [];
  let current = '';
  for(const byte of bytes) {
    const ch = String.fromCharCode(byte);
    if(/[A-Za-z0-9+/=]/.test(ch)) {
      current += ch;
    } else {
      if(current.length >= 8) candidates.push(current);
      current = '';
    }
  }
  if(current.length >= 8) candidates.push(current);

  // Sort by length descending — correct data is the longest valid sequence
  candidates.sort((a,b) => b.length - a.length);
  console.log('[tryDecode] %d candidates, longest=%d', candidates.length, candidates[0]?.length||0);

  for(let ci=0; ci<Math.min(candidates.length, 10); ci++) {
    let base64Str = candidates[ci];
    // Try raw and padded (to multiple-of-4) versions
    const variants = [base64Str];
    let padded = base64Str;
    while(padded.length % 4) padded += '=';
    if(padded !== base64Str) variants.push(padded);

    for(const variant of variants) {
      try {
        const json = decodeURIComponent(escape(atob(variant)));
        const parsed = JSON.parse(json);
        if(parsed && (parsed.n || parsed.name)) {
          console.log('[tryDecode] SUCCESS candidate#%d len=%d', ci, variant.length);
          return parsed;
        }
      } catch(e) { /* try next */ }
    }
  }
  console.log('[tryDecode] all candidates exhausted');
  return null;
}

// ==================== IMPORT ====================
async function handleImportFile(e) {
  const file = e.target.files[0];
  if(!file) return;
  importFileInput.value = '';
  showLoading(true, '解析图片数据...');

  try {
    const img = await loadImgFromFile(file);
    const imgW = img.width, imgH = img.height;
    console.log('[import] img loaded: %dx%d', imgW, imgH);

    const ratio = imgW / CANVAS_BASE_W;
    const totalH = CANVAS_BASE_H;
    const stripStartRow = Math.round(totalH * ratio);
    const stripPixelRows = imgH - stripStartRow;

    console.log('[import] ratio=%.4f stripStart=%d stripRows=%d', ratio, stripStartRow, stripPixelRows);

    // ===== MOBILE-FRIENDLY: only read the strip region, not the whole image =====
    // Full image is ~9M pixels (36MB RGBA) — phones can't handle getImageData on that.
    // We only need the bottom strip for barcode decoding.
    let metadata = null;
    if(stripPixelRows > 20 && stripStartRow < imgH) {
      const stripCanvas = document.createElement('canvas');
      stripCanvas.width = imgW;
      stripCanvas.height = stripPixelRows;
      const sctx = stripCanvas.getContext('2d');
      // Draw only the strip region from the original image
      sctx.drawImage(img, 0, stripStartRow, imgW, stripPixelRows, 0, 0, imgW, stripPixelRows);

      try {
        const stripImageData = sctx.getImageData(0, 0, imgW, stripPixelRows);
        // decodeBlocks now uses row 0 = first strip row (no stripStartRow offset needed)
        metadata = decodeBlocks(stripImageData, imgW, 0, stripPixelRows);
        console.log('[import] strip-only decode result:', !!metadata);
      } catch(stripErr) {
        console.warn('[import] strip getImageData failed:', stripErr.message);
        // Fall through to OCR
      }
    }

    if(!metadata) {
      // Strip decode failed — try OCR text recovery from known layout
      // For mobile: downscale the image first to save memory during OCR
      showLoading(true, '条码解析失败，尝试识别文字...');
      console.log('[import] Strip decode failed, falling back to OCR');

      // Downscale for OCR (target max 1200px wide for mobile memory safety)
      let ocrImg = img;
      const MAX_OCR_W = 1200;
      if(imgW > MAX_OCR_W) {
        const ocrScale = MAX_OCR_W / imgW;
        const ocrCanvas = document.createElement('canvas');
        ocrCanvas.width = MAX_OCR_W;
        ocrCanvas.height = Math.round(imgH * ocrScale);
        const ocrCtx = ocrCanvas.getContext('2d');
        ocrCtx.drawImage(img, 0, 0, ocrCanvas.width, ocrCanvas.height);
        // Create a new Image from the downscaled canvas
        ocrImg = await new Promise((resolve, reject) => {
          const tmp = new Image();
          tmp.onload = () => resolve(tmp);
          tmp.onerror = reject;
          tmp.src = ocrCanvas.toDataURL('image/jpeg', 0.8);
        });
        console.log('[import] OCR image downscaled: %dx%d -> %dx%d', imgW, imgH, ocrImg.width, ocrImg.height);
      }

      const ocrRatio = ocrImg.width / CANVAS_BASE_W;
      metadata = await ocrRecoverMetadata(ocrImg, ocrRatio);
      if(!metadata) {
        showLoading(false);
        showToast('未识别到数据，请确认是导出的图片');
        return;
      }
    }

    const hasEmbeddedCoords = !!(metadata.f >= 2 && metadata.fc);
    const sections = {};
    for(const key of SECTION_KEYS) {
      let px, py, pw, ph;
      if (hasEmbeddedCoords && metadata.fc[key]) {
        const c = metadata.fc[key];
        px = Math.round(c.x * ratio);
        py = Math.round(c.y * ratio);
        pw = Math.round(c.w * ratio);
        ph = Math.round(c.h * ratio);
      } else {
        const pos = facePos[key];
        const fx = MARGIN + pos.col * (FACE_W + FACE_GAP);
        const fy = MARGIN + HEADER_H + pos.row * (FACE_H + FACE_GAP);
        const PAD = 8;
        px = Math.round((fx + PAD) * ratio);
        py = Math.round((fy + 24) * ratio);
        pw = Math.round((FACE_W - PAD*2) * ratio);
        ph = Math.round((FACE_H - 24 - 8) * 0.72 * ratio);
      }

      px = Math.max(0, Math.min(px, img.width - 1));
      py = Math.max(0, Math.min(py, img.height - 1));
      pw = Math.min(pw, img.width - px);
      ph = Math.min(ph, img.height - py);

      let photoSrc = '';
      if (pw > 10 && ph > 10) {
        try {
          const pc = document.createElement('canvas');
          pc.width = pw; pc.height = ph;
          pc.getContext('2d').drawImage(img, px, py, pw, ph, 0, 0, pw, ph);
          if (isPhotoContent(pc)) {
            photoSrc = pc.toDataURL('image/jpeg', 0.85);
          }
        } catch(err) { /* skip */ }
      }

      const text = metadata.fs
        ? (metadata.fs[key] ? (metadata.fs[key].t || '') : '')
        : (metadata.sections ? (metadata.sections[key] || '') : '');
      sections[key] = { photo: photoSrc, text };
    }

    const newEntry = {
      ...createEmptyEntry(),
      name: metadata.n || metadata.name || '导入的发型',
      version: metadata.v || metadata.version || 1,
      tags: metadata.tg || metadata.tags || [],
      sections,
      updatedAt: new Date().toISOString(),
    };
    entries.push(newEntry);
    saveEntries(entries);
    currentEntryId = newEntry.id;
    showLoading(false);
    showToast('导入成功！');
    renderPreview();
    showView('preview');
  } catch(err) {
    showLoading(false);
    console.error('Import error:', err);
    showToast('导入失败，请重试');
  }
}

// ==================== OCR TEXT RECOVERY ====================
// When strip decoding fails, recover text from known layout positions.
async function ocrRecoverMetadata(img, ratio) {
  console.log('[ocr] Starting OCR recovery, ratio=%.4f img=%dx%d', ratio, img.width, img.height);

  const ctx = document.createElement('canvas').getContext('2d');

  // 1. Recover name from header region (center-aligned, bold 18px)
  const separatorY = MARGIN + (HEADER_H / 2); // = 99
  const nameY = separatorY + 22;
  const npx = Math.round(MARGIN * ratio);
  const npy = Math.round(nameY * ratio);
  const npw = Math.round((CANVAS_BASE_W - MARGIN*2) * ratio);
  const nph = Math.round(28 * ratio);

  let bestName = '导入的发型';
  let bestScore = Infinity;

  // Try matching against all known names: existing entries + presets + commons
  const allNames = new Set();
  entries.forEach(e => { if(e.name) allNames.add(e.name); });
  PRESET_HAIRSTYLES.forEach(h => allNames.add(h.name));
  ['美式前刺','渐变短发','自然微卷','侧分油头','碎盖','狼尾','微分碎盖','韩式纹理','纹理短发','法式慵懒卷','鲻鱼头','渐变Fade','复古油头','中分','三七分','锅盖头','日系湿发','莫西干','纹理短发'].forEach(n => allNames.add(n));

  for(const name of allNames) {
    const score = compareTextRegion(ctx, img, npx, npy, npw, nph, name, ratio, 18, true);
    if(score < bestScore) { bestScore = score; bestName = name; }
  }
  // If score is too high (poor match), use default
  if(bestScore > nph * npw * 150) {
    console.log('[ocr] Name match poor (score=%d), using default', bestScore);
    bestName = '导入的发型';
  }
  console.log('[ocr] Best name: "%s" (score=%d)', bestName, bestScore);

  // 2. Recover version from footer: looks for "v1", "v2" etc.
  const dateStrY = MARGIN + HEADER_H + FACE_H*4 + FACE_GAP*3 + 15 + QR_SIZE - 20;
  const vpx = Math.round(MARGIN * ratio);
  const vpy = Math.round(dateStrY * ratio);
  const vpw = Math.round(200 * ratio);
  const vph = Math.round(16 * ratio);

  let bestVer = 1, bestVerScore = Infinity;
  for(let v=1; v<=20; v++) {
    const score = compareTextRegion(ctx, img, vpx, vpy, vpw, vph, 'v'+v, ratio, 11, false);
    if(score < bestVerScore) { bestVerScore = score; bestVer = v; }
  }
  console.log('[ocr] Best version: v%d (score=%d)', bestVer, bestVerScore);

  // 3. Recover tags from header tag region
  const tagRegionY = separatorY + 44;
  const tpy = Math.round(tagRegionY * ratio);
  const tpw = Math.round((CANVAS_BASE_W - MARGIN*2) * ratio);
  const tph = Math.round(18 * ratio);

  const allTags = [...new Set(entries.flatMap(e => e.tags || []))];
  let tags = [];
  for(const tag of allTags) {
    const score = compareTextRegion(ctx, img, npx, tpy, tpw, tph, '#'+tag, ratio, 11, false);
    if(score < tph * tpw * 120) {
      tags.push(tag);
    }
  }
  console.log('[ocr] Matched tags:', tags);

  // 4. Try to recover section texts by looking at each section's text area
  // For each section, try matching against known prompt texts and entry data
  const sections = {};
  for(const key of SECTION_KEYS) {
    // Get the section text region coordinates
    const pos = facePos[key];
    const fx = MARGIN + pos.col * (FACE_W + FACE_GAP);
    const fy = MARGIN + HEADER_H + pos.row * (FACE_H + FACE_GAP);
    const PAD = 8;

    // Photo occupies 72% of (FACE_H - 24 - 8), text starts after photo + 6px gap
    const availH = FACE_H - 24 - 8;
    const photoH = Math.round(availH * 0.72);
    const textTopY = fy + 24 + photoH + 6;
    const textH = (fy + FACE_H) - textTopY - 4;
    const textW = FACE_W - PAD*2;

    const stx = Math.round((fx + PAD) * ratio);
    const sty = Math.round(textTopY * ratio);
    const stw = Math.round(textW * ratio);
    const sth = Math.round(textH * ratio);

    // Try to find the best-matching known text for this section
    let bestText = '';
    let bestTextScore = Infinity;

    // If we have entries with the same name, use their section texts as candidates
    if(bestName && bestName !== '导入的发型') {
      const matchingEntries = entries.filter(e => e.name === bestName);
      for(const e of matchingEntries) {
        const candidate = (e.sections[key] && e.sections[key].text) ? e.sections[key].text.trim() : '';
        if(candidate) {
          const score = compareTextRegion(ctx, img, stx, sty, stw, sth, candidate.substring(0, 50), ratio, 11, false);
          if(score < bestTextScore) { bestTextScore = score; bestText = candidate; }
        }
      }
    }

    // Also try prompt library texts
    const prompts = PROMPT_LIBRARY[key] || [];
    for(const prompt of prompts) {
      const score = compareTextRegion(ctx, img, stx, sty, stw, sth, prompt.substring(0, 60), ratio, 11, false);
      if(score < bestTextScore) { bestTextScore = score; bestText = prompt; }
    }

    // Only accept if match is reasonably good
    if(bestTextScore < sth * stw * 100) {
      sections[key] = cleanOcrText(bestText);
      console.log('[ocr] Section %s matched text: "%s"', key, sections[key].substring(0, 40));
    } else {
      sections[key] = '';
      console.log('[ocr] Section %s no match (score=%d)', key, bestTextScore);
    }
  }

  // 5. Build metadata
  return {
    f: 1,
    n: bestName,
    v: bestVer,
    tg: tags,
    sections: sections,
  };
}

// Clean OCR-recovered text: trim whitespace, normalize newlines, remove artifacts
function cleanOcrText(text) {
  if(!text) return '';
  return text
    .replace(/[\r\n]{3,}/g, '\n\n')  // collapse excessive newlines
    .replace(/[ \t]{2,}/g, ' ')       // collapse excessive spaces
    .replace(/^\s+|\s+$/g, '')        // trim
    .replace(/\n +/g, '\n')           // remove leading spaces after newlines
    .replace(/ +\n/g, '\n');          // remove trailing spaces before newlines
}

// Compare a text region in the image with rendered text
function compareTextRegion(ctx, img, px, py, pw, ph, text, scale, fontSize, isBold) {
  if (pw <= 0 || ph <= 0 || !text) return Infinity;
  fontSize = fontSize || 18;

  // Render candidate text on a hidden canvas
  const refCanvas = document.createElement('canvas');
  refCanvas.width = pw; refCanvas.height = ph;
  const rc = refCanvas.getContext('2d');
  rc.fillStyle = '#ffffff';
  rc.fillRect(0, 0, pw, ph);

  // Match export header font style
  const fs = Math.round(fontSize * scale);
  rc.font = `${isBold?'bold ':''}${fs}px -apple-system, "PingFang SC", sans-serif`;
  rc.fillStyle = '#1e1e24';
  rc.textAlign = 'center';
  rc.textBaseline = 'top';
  rc.fillText(text, pw/2, Math.max(0, (ph - fs) / 2));

  // Extract source region
  const srcCanvas = document.createElement('canvas');
  srcCanvas.width = pw; srcCanvas.height = ph;
  const sc = srcCanvas.getContext('2d');
  sc.drawImage(img, px, py, pw, ph, 0, 0, pw, ph);

  // Compare pixel values (downscaled for performance)
  const cmpW = Math.min(pw, 80);
  const cmpH = Math.min(ph, 24);
  const refData = getDownscaledGrayData(rc, pw, ph, cmpW, cmpH);
  const srcData = getDownscaledGrayData(sc, pw, ph, cmpW, cmpH);

  let diff = 0;
  const len = Math.min(refData.length, srcData.length);
  for(let i=0; i<len; i++) {
    diff += Math.abs(refData[i] - srcData[i]);
  }
  return diff;
}

function getDownscaledGrayData(sourceCtx, sw, sh, dw, dh) {
  const c = document.createElement('canvas');
  c.width = dw; c.height = dh;
  const tc = c.getContext('2d');
  tc.drawImage(sourceCtx.canvas, 0, 0, sw, sh, 0, 0, dw, dh);
  const data = tc.getImageData(0, 0, dw, dh).data;
  const gray = new Array(dw * dh);
  for(let i=0; i<gray.length; i++) {
    gray[i] = Math.round(data[i*4]*0.299 + data[i*4+1]*0.587 + data[i*4+2]*0.114);
  }
  return gray;
}

// Detect if an extracted canvas region contains a real photo (not gray placeholder)
function isPhotoContent(canvas) {
  try {
    // Downscale to tiny thumbnail for fast analysis
    const thumbW = 16, thumbH = 16;
    const thumb = document.createElement('canvas');
    thumb.width = thumbW; thumb.height = thumbH;
    const tc = thumb.getContext('2d');
    tc.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, thumbW, thumbH);

    const data = tc.getImageData(0, 0, thumbW, thumbH).data;
    const n = data.length / 4;

    // Compute variance across all pixels of the thumbnail
    let sumR = 0, sumG = 0, sumB = 0;
    for (let i = 0; i < data.length; i += 4) {
      sumR += data[i]; sumG += data[i + 1]; sumB += data[i + 2];
    }
    const avgR = sumR / n, avgG = sumG / n, avgB = sumB / n;

    // If the average color is close to gray (R≈G≈B) and all values are in mid-high range,
    // it's likely the gray placeholder background used in exports
    const isGrayish = Math.abs(avgR - avgG) < 15 && Math.abs(avgG - avgB) < 15 && Math.abs(avgR - avgB) < 15;
    const isMidTone = avgR > 200 && avgR < 250;

    if (isGrayish && isMidTone) {
      // Check variance — gray placeholder has very low variance
      let variance = 0;
      for (let i = 0; i < data.length; i += 4) {
        variance += (data[i] - avgR) ** 2 + (data[i + 1] - avgG) ** 2 + (data[i + 2] - avgB) ** 2;
      }
      variance /= n;
      // Real photos have significant color variation
      if (variance < 200) return false;
    }

    // If not grayish-midtone, it's definitely a real photo
    return true;
  } catch (e) { return false; }
}

// ==================== HELPERS ====================
function loadImg(src, timeoutMs=8000){ return new Promise((resolve,reject)=>{ const img=new Image(); const timer=setTimeout(()=>{ img.src=''; reject(new Error('img load timeout')); },timeoutMs); if(/^https?:/.test(src)) img.crossOrigin='anonymous'; img.onload=()=>{ clearTimeout(timer); resolve(img); }; img.onerror=()=>{ clearTimeout(timer); reject(new Error('img load error')); }; img.src=src; }); }
function loadImgFromFile(file){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=e=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=e.target.result; }; reader.onerror=reject; reader.readAsDataURL(file); }); }

// ==================== ONBOARDING ====================
let obStep=0; const TOTAL_STEPS=5;
function initOnboarding(){ if(isOnboarded()){ obOverlay.classList.remove('show'); return; } obOverlay.classList.add('show'); renderObDots(); updateObStep(); }
function renderObDots(){ const d=$('#obDots'); d.innerHTML=''; for(let i=0;i<TOTAL_STEPS;i++){ const dot=document.createElement('span'); dot.className='onboarding-dot'+(i===obStep?' active':''); d.appendChild(dot); } }
function updateObStep(){ $$('.onboarding-step').forEach(s=>s.classList.toggle('active',parseInt(s.dataset.step)===obStep)); renderObDots(); $('#obNext').textContent=obStep<TOTAL_STEPS-1?'下一步':'开始使用'; }
function onboardingNext(){ if(obStep<TOTAL_STEPS-1){ obStep++; updateObStep(); } else { obOverlay.classList.remove('show'); setOnboarded(); } }

// ==================== TOAST ====================
let toastTimer;
function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2000); }
function showConfirm(msg,cb){ confirmMsg.textContent=msg; confirmCallback=cb; confirmOverlay.classList.add('show'); }
function showLoading(show,txt){ loadingOverlay.classList.toggle('show',show); if(txt) loadingText.textContent=txt; else loadingText.textContent=''; }

document.addEventListener('DOMContentLoaded', init);
